# ViciBox Install Configuration
# SECRETS — do NOT commit this file (it is listed in .gitignore)
#
# Used by vici_changes_vb12.sh to drive vicibox-install non-interactively
# and to configure the post-install ViciDial settings.

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
FQDN="example.com"           # replace with actual FQDN before running
SSH_PORT="2008"
SSL_EMAIL="info@example.com"
SKIP_SSL=0                       # set to 0 once FQDN has valid DNS pointing here

# ---------------------------------------------------------------------------
# vicibox-install — Database credentials
# ---------------------------------------------------------------------------
VB_DB_USERNAME="asterisk"
VB_DB_PASSWORD="1234"
VB_DB_NAME="asterisk"
VB_DB_CUSTOM_USERNAME="asterisk"
VB_DB_CUSTOM_PASSWORD="1234"
VB_DB_PORT=""                    # blank = keep default 3306
VB_DB_SLAVE_USER="asterisk"
VB_DB_SLAVE_PASS="1234"

# ---------------------------------------------------------------------------
# Post-install — Agent setup
# ---------------------------------------------------------------------------
USERS="10"                       # number of agent users to create
